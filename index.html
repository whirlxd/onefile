<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONEFILE Web Bundler</title>
    <style>
        :root {
            --purple: #a87ffb;
            --green: #17b877;
            --background: #0A0A0B;
            --surface: #1A1A1B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace, -apple-system, sans-serif;
            background-color: var(--background);
            color: #fff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }


        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .hero {
            text-align: center;
            margin: 4rem 0;
        }

        .letter-grid {
            display: inline-grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 4px;
            margin: 0 auto;
        }

        .letter {
            width: 40px;
            height: 40px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .letter.green {
            color: var(--green);
        }

        .letter.purple {
            color: var(--purple);
        }

        .drop-zone {
            background: var(--surface);
            border: 2px dashed rgba(157, 92, 255, 0.3);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--purple);
            box-shadow: 0 0 30px rgba(157, 92, 255, 0.2);
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(157, 92, 255, 0.1), rgba(74, 222, 128, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drop-zone.drag-over::before {
            opacity: 1;
        }

        .file-list {
            margin: 2rem 0;
            list-style: none;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .button {
            background: var(--purple);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.9;
        }

        .button:hover {
            opacity: 1;
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(157, 92, 255, 0.3);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button.download {
            background: var(--green);
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(157, 92, 255, 0.5); }
            50% { box-shadow: 0 0 20px rgba(157, 92, 255, 0.8); }
            100% { box-shadow: 0 0 5px rgba(157, 92, 255, 0.5); }
        }

        .processing {
            animation: glow 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="letter-grid">
                <div class="letter">W</div>
                <div class="letter">E</div>
                <div class="letter">B</div>
                <div class="letter green">></div>
                <div class="letter">B</div>
                <div class="letter">U</div>
                <div class="letter">N</div>
                <div class="letter">D</div>
                <div class="letter">L</div>
                <div class="letter">E</div>
                <div class="letter">R</div>
            </div>
            <p style="margin-top: 2rem; opacity: 0.7;">Drag and drop your HTML, CSS, and JavaScript files to bundle them</p>
        </div>

        <div class="drop-zone" id="dropZone">
            <p>Drop your files here or click to select</p>
            <input type="file" id="fileInput" multiple accept=".html,.css,.js" style="display: none;">
        </div>

        <ul class="file-list" id="fileList"></ul>

        <div style="text-align: center;">
            <button class="button" id="bundleButton" disabled>Bundle and Compress</button>
            <button class="button download" id="downloadButton" style="display: none;">Download Bundle</button>
        </div>
    </div>
<script defer>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileList = document.getElementById("fileList");
const bundleButton = document.getElementById("bundleButton");
const downloadButton = document.getElementById("downloadButton");
function minifyHTML(html) {
	return html.replace(/\s+/g, " ").replace(/<!--.*?-->/g, "");
}
function minifyCSS(css) {
	return css.replace(/\s+/g, " ").replace(/\/\*.*?\*\//g, "");
}
function minifyJS(js) {
	return js
		.replace(/\s+/g, " ")
		.replace(/\/\*.*?\*\//g, "")
		.replace(/\/\/.*(?=[\n\r])/g, "")
    .replace(/\/\*[\s\S]*?\*\/|\/\/.*$/gm, ''); 
}
const files = {
	html: null,
	css: null,
	js: null,
};
["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
	dropZone.addEventListener(eventName, preventDefaults, false);
});

function preventDefaults(e) {
	e.preventDefault();
	e.stopPropagation();
}

["dragenter", "dragover"].forEach((eventName) => {
	dropZone.addEventListener(eventName, () => {
		dropZone.classList.add("drag-over");
	});
});

["dragleave", "drop"].forEach((eventName) => {
	dropZone.addEventListener(eventName, () => {
		dropZone.classList.remove("drag-over");
	});
});

dropZone.addEventListener("drop", handleDrop);
dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", handleFileSelect);
function handleDrop(e) {
	const dt = e.dataTransfer;
	const droppedFiles = [...dt.files];
	handleFiles(droppedFiles);
}
function handleFileSelect(e) {
	const selectedFiles = [...e.target.files];
	handleFiles(selectedFiles);
}

function handleFiles(fileList) {
	fileList.forEach((file) => {
		const extension = file.name.split(".").pop().toLowerCase();
		if (["html", "css", "js"].includes(extension)) {
			files[extension] = file;
			updateFileList();
		}
	});

	bundleButton.disabled = !(files.html || files.css || files.js);
}
function updateFileList() {
	fileList.innerHTML = "";
	Object.entries(files).forEach(([type, file]) => {
		if (file) {
			const li = document.createElement("li");
			li.className = "file-item";
			li.innerHTML = `
                        <span>${file.name}</span>
                        <button onclick="removeFile('${type}')" class="button" style="padding: 0.5rem 1rem;">Remove</button>
                    `;
			fileList.appendChild(li);
		}
	});
}
function removeFile(type) {
	files[type] = null;
	updateFileList();
	bundleButton.disabled = !(files.html || files.css || files.js);
	downloadButton.style.display = "none";
}
bundleButton.addEventListener("click", async () => {
	try {
		bundleButton.classList.add("processing");
		bundleButton.disabled = true;
		let bundledContent = "";
		let cssContent = "";
		let jsContent = "";
		if (files.html) {
			bundledContent = await files.html.text();
			bundledContent = minifyHTML(bundledContent);
		} else {
			bundledContent =
				"<!DOCTYPE html><html><head><title>Bundled File</title></head><body></body></html>";
		}
		if (files.css) {
			cssContent = await files.css.text();
			cssContent = minifyCSS(cssContent);
    }
		if (files.js) {
			jsContent = await files.js.text();
			jsContent = minifyJS(jsContent);
		}
		if (cssContent) {
			const styleTag = `<style>${cssContent}</style>`;
			bundledContent = bundledContent.replace("</head>", `${styleTag}</head>`);
		}
		if (jsContent) {
			const scriptTag = `<script>${jsContent}<\\/script>`;
			bundledContent = bundledContent.replace("</body>", `${scriptTag}</body>`);
		}
		const blob = new Blob([bundledContent], { type: "text/html" });
		const url = URL.createObjectURL(blob);
		downloadButton.onclick = () => {
			const a = document.createElement("a");
			a.href = url;
			a.download = "bundle.html";
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
		};
		downloadButton.style.display = "inline-block";
	} catch (error) {
		console.error("Bundling error:", error);
		alert("An error occurred while bundling the files. Please try again.");
	} finally {
		bundleButton.classList.remove("processing");
		bundleButton.disabled = false;
	}
});
</script>
</body>
</html>
